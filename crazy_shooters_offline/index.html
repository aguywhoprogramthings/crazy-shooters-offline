<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Crazy Shooters - Offline Edition</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script>
      // Sitelock bypass: Spoof document.URL & documentURI for Unity Application.absoluteURL
      try {
        const spoofedUrl = 'https://html5.gamedistribution.com/rvvASMiM/20454ead6fe14ae6bd3127efbc813bdb/index.html';
        Object.defineProperty(document, 'URL', {
          get: function() { return spoofedUrl; },
          configurable: true
        });
        Object.defineProperty(document, 'documentURI', {
          get: function() { return spoofedUrl; },
          configurable: true
        });
      } catch (e) {
        console.warn('URL spoof error:', e);
      }
    </script>
    <script src="TemplateData/UnityProgress.js"></script>  
    <script src="Build/UnityLoader.js"></script>
    <script src="gdsdk_mock.js"></script>
    <script src="mod_ammo.js"></script>
    <script src="mod_tactical_ai.js"></script>
    <script>
      function InitApi(_appId) {
        console.log('[Crazy Shooters] InitApi registered with AppId:', _appId);
      }
      
      function ExternEval() {
        console.log('[Crazy Shooters] ExternEval triggered');
        if (typeof window.gdsdk !== "undefined") {
          window.gdsdk.showBanner();
        }
      }
      
      function PreloadRewarded() {
        console.log('[Crazy Shooters] PreloadRewarded triggered');
        if (typeof window.gdsdk !== "undefined") {
          window.gdsdk.preloadAd('rewarded').then(function() {
            if (window.gameInstance) {
              window.gameInstance.SendMessage('GameDistribution', 'RewardedReady');
            }
          }).catch(function() {
            if (window.gameInstance) {
              window.gameInstance.SendMessage('GameDistribution', 'RewardedError');
            }
          });
        }
      }
      
      function ShowRewarded() {
        console.log('[Crazy Shooters] ShowRewarded triggered');
        if (typeof window.gdsdk !== "undefined") {
          window.gdsdk.showAd('rewarded');
        }
      }
      
      InitApi("20454ead6fe14ae6bd3127efbc813bdb");
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/game.json", {onProgress: UnityProgress});

      function FitScreen() {
        var w = window.innerWidth;
        var h = window.innerHeight;
        var canvas = document.getElementById("#canvas");
        var gc = document.getElementById("gameContainer");
        if (!canvas || !gc) return;
        
        canvas.width = w;
        canvas.height = h;
        gc.style.width = w + "px";
        gc.style.height = h + "px";
      }
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #231F20;
      }
      .webgl-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: none !important;
      }
      #gameContainer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #231F20;
      }
      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body onfocus="FitScreen();" onload="FitScreen();" onresize="FitScreen();">
    <div class="webgl-content">
      <div id="gameContainer">
        <canvas id="#canvas" width="1920" height="1009" style="cursor: default;"></canvas>
        <div class="logo Dark" style="display: none;"></div>
        <div class="progress Dark" style="display: none;">
          <div class="empty" style="width: 0%;"></div>
          <div class="full" style="width: 100%;"></div>
        </div>
      </div>
    </div>
  </body>
</html>
