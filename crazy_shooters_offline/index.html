<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Crazy Shooters - Offline Edition</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <script>
      // Sitelock bypass: Spoof document.URL & documentURI for Unity Application.absoluteURL
      try {
        const spoofedUrl = 'https://html5.gamedistribution.com/rvvASMiM/20454ead6fe14ae6bd3127efbc813bdb/index.html';
        Object.defineProperty(document, 'URL', {
          get: function() { return spoofedUrl; },
          configurable: true
        });
        Object.defineProperty(document, 'documentURI', {
          get: function() { return spoofedUrl; },
          configurable: true
        });
      } catch (e) {
        console.warn('URL spoof error:', e);
      }
    </script>
    <script src="TemplateData/UnityProgress.js"></script>  
    <script src="Build/UnityLoader.js"></script>
    <script src="gdsdk_mock.js"></script>
    <script src="heap_scanner.js"></script>
    <script src="mod_ammo.js"></script>
    <script src="mod_tactical_ai.js"></script>
    <script src="display_settings.js"></script>
    <script src="offline_mode.js"></script>
    <script>
      function InitApi(_appId) {
        console.log('[Crazy Shooters] InitApi registered with AppId:', _appId);
      }
      
      function ExternEval() {
        console.log('[Crazy Shooters] ExternEval triggered');
        if (typeof window.gdsdk !== "undefined") {
          window.gdsdk.showBanner();
        }
      }
      
      function PreloadRewarded() {
        console.log('[Crazy Shooters] PreloadRewarded triggered');
        if (typeof window.gdsdk !== "undefined") {
          window.gdsdk.preloadAd('rewarded').then(function() {
            if (window.gameInstance) {
              window.gameInstance.SendMessage('GameDistribution', 'RewardedReady');
            }
          }).catch(function() {
            if (window.gameInstance) {
              window.gameInstance.SendMessage('GameDistribution', 'RewardedError');
            }
          });
        }
      }
      
      function ShowRewarded() {
        console.log('[Crazy Shooters] ShowRewarded triggered');
        if (typeof window.gdsdk !== "undefined") {
          window.gdsdk.showAd('rewarded');
        }
      }
      
      InitApi("20454ead6fe14ae6bd3127efbc813bdb");
      function OnGameProgress(instance, progress) {
        UnityProgress(instance, progress);
        if (progress === 1) window.CrazyShootersOffline.notifyUnityReady();
      }
      var gameInstance = UnityLoader.instantiate("gameContainer", "Build/game.json", {onProgress: OnGameProgress});


    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #231F20;
      }
      .webgl-content {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: none !important;
      }
      #gameContainer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #231F20;
      }
      #gameContainer canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .display-settings {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 100000;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.88);
        color: #fff;
        font: 12px system-ui, sans-serif;
      }
      .display-settings select {
        max-width: 150px;
        color: #fff;
        background: #1e293b;
        border: 1px solid #64748b;
        border-radius: 4px;
        padding: 3px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer">

      </div>
    </div>
    <div class="display-settings">
      <span id="connection-mode" role="status">Preparing offline…</span>
      <label for="graphics-quality">Graphics</label>
      <select id="graphics-quality" title="Lower the rendering resolution to improve performance">
        <option value="balanced">Balanced (720p max)</option>
        <option value="performance">Performance (540p max)</option>
        <option value="native">Native resolution</option>
      </select>
    </div>
  </body>
</html>
