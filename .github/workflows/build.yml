name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Unit and server tests
        run: npm test
      - name: Real Unity browser smoke test
        run: npm run test:browser
      - name: Package the checked-in game
        run: |
          zip -q -r crazy-shooters-offline.zip crazy_shooters_offline -x '*/__pycache__/*' '*.pyc'
          sha256sum crazy-shooters-offline.zip > crazy-shooters-offline.zip.sha256
      - name: Upload game package
        uses: actions/upload-artifact@v7
        with:
          name: crazy-shooters-offline
          path: |
            crazy-shooters-offline.zip
            crazy-shooters-offline.zip.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure
          path: test-results/browser-failure.png
          if-no-files-found: ignore

  online-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check the original Photon service (informational)
        continue-on-error: true
        env:
          CSO_ONLINE_ROOM_TEST: '1'
        run: |
          if npm run test:online; then
            echo "::notice title=Photon live check::The Unity client connected, created a temporary test room and spawned from the GitHub runner."
          else
            echo "::warning title=Photon live check::Could not confirm a connection from the GitHub runner; the external service or network may be unavailable."
            exit 1
          fi

  windows-launchers:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify Windows launchers with an occupied port
        shell: pwsh
        run: |
          $output = & node --test --test-force-exit --test-timeout=60000 test/windows_launcher.test.js 2>&1
          $result = $LASTEXITCODE
          $text = $output | Out-String
          Write-Host $text
          if ($result -ne 0) {
            $escaped = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows launcher test failed::$escaped"
            exit $result
          }
